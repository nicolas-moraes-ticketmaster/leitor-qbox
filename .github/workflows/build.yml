name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee build.log

      # Erros de compilação viram anotações (visíveis sem login no GitHub).
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|ERROR:' build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LeitorQBOX.apk

      # Link fixo para a última versão:
      # https://github.com/<usuario>/<repo>/releases/latest/download/LeitorQBOX.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leitor QBOX 1.0.${{ github.run_number }}
          files: LeitorQBOX.apk
          make_latest: "true"
